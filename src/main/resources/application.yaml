spring:
  application:
    name: users
  datasource:
    url: jdbc:postgresql://localhost:5432/users
    username: postgres
    password: 1234
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    
  jackson:
    default-property-inclusion: non_null

server:
  servlet:
    context-path: /api/v1

jwt:
  private-key: ${PRIVATE_KEY}
  public-key: ${PUBLIC_KEY}
  expiration: 86400000

